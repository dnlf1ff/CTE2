---

data:
    input: ./POSCAR_Si
    load_args:
        format: vasp
        index: 0
    output: omni
    cwd: /home/jinvk/example/omni

calculator:
    calc_type: omni
    model_path: /data2/shared_data/cps/omni/oob_v6/checkpoint_1.pth
    calc_args:
        device: cuda
        modal: omat24

unitcell:
    run: true
    load: false
    save: /home/jinvk/example/omni/./unitcell
    primitive_matrix: [[0, 0.5, 0.5], [0.5, 0, 0.5], [0.5, 0.5, 0]]

deform:
    save: /home/jinvk/example/omni/./deform
    run: true
    load: false
    load_opt: false
    ratio: [0.96, 0.98, 1.0, 1.02, 1.04]

supercell:
    save: /home/jinvk/example/omni/./supercell
    run: true
    symprec: 1.0e-05
    supercell_matrix: [2, 2, 2]
    distance: 0.01
    random_seed: 42

phonon:
    save: /home/jinvk/example/omni/./phonon
    symm_fc2: true
    mesh_numbers: [21, 21, 21]
    run_dos: true
    run_band: true
    symprec: 1.0e-05
    t_min: 0
    t_max: 1000
    t_step: 2

qha:
    save: /home/jinvk/example/omni/./qha
    t_max: 901
    thin_number: 50
    data: ./data
    plot: ./plot
    full: ./full
    eos: birch_murnaghan

opt:
    unitcell:
        fmax: 0.001
        steps: 5000
        optimizer: fire2
        fix_symm: true
        cell_filter: unitcell
        mask: [1, 1, 1, 1, 1, 1]
    deform:
        fmax: 0.001
        steps: 5000
        optimizer: fire2
        fix_symm: true
        cell_filter: unitcell
        mask: [0, 0, 0, 0, 0, 0]
...
