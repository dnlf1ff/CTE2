---

data:
    input: ./POSCAR # input structure file
    load_args:
        format: vasp
        index: 0
    cwd: omni

calculator:
    family: sevenn # for logging purpose
    model: omni # for logging purpose
    path: # MLIP potential file
    calc_args: # will be pased to SevenNetCalculator 
        device: cuda
        modal: omat24
        enable_flash: true

unitcell:
    run: true
    load: false # if true, ./unitcell/CONTCAR will be read
    save: ./unitcell
    primitive_matrix: auto # 3 by 3 list or one from [a, b, c, f, i, r, p, auto] following phonopy's logic

deform:
    save: ./deform
    run: true
    load: false # if true ./deform/e0/POSCAR .. will be read
    load_opt: false # if true, ./deform/e0/CONTCAR .. will be read
    ratio: [0.95, 0.96, 0.97, 0.98, 0.99, 1.00, 1.01, 1.02, 1.03, 1.04, 1.05] # list of scaling factors

supercell:
    save: ./supercell
    run: true
    symprec: 1.0e-05
    supercell_matrix: [3, 3, 2]
    distance: 0.01 # phonopy default
    random_seed: 42

phonon:
    save: ./phonon
    symm_fc2: true
    mesh_numbers: [21, 21, 19]
    run_fc2: true
    run_harmonic: true
    load_fc2: false
    load_thermal: false
    run_dos: true # if false, will be skipped
    run_band: true # if false, will be skipped
    symprec: 1.0e-05
    t_min: 0 # t_min for calculating thermal properties
    t_max: 1405 # t_max for calculating thermal properties
    t_step: 2 # delta t for thermal properties

qha:
    run: true
    save: ./qha
    t_max: 2005 # temperature limit for qha
    thin_number: 50 # interval temp displayed on F-V.png
    data: ./data
    plot: ./plot
    full: ./full
    eos: birch_murnaghan # ['vinet', 'birch', 'birch_murnaghan']

opt:
    unitcell:
        fmax: 1.0e-06
        steps: 2500
        optimizer: fire
        fix_symm: true
        cell_filter: frechet
        mask: [1, 1, 1, 1, 1, 1]

    deform:
        fmax: 1.0e-06
        steps: 2500
        optimizer: fire
        fix_symm: true
        cell_filter: frechet
        mask: [0, 0, 0, 0, 0, 0]

...
