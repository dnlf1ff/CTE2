---

data:
    input: ./input/Al_POSCAR
    load_args:
        format: vasp
        index: 0
    output: test

calculator:
    calc_type: 7net-0
    model_path: /data2/shared_data/pretrained/7net_chgTot/checkpoint_best.pth
    calc_args:
        device: gpu
        # modal: omat24

unitcell:
    run: true
    # load: null
    save: ./unitcell
    primitive_matrix: [[0,0.5,0.5],[0.5,0,0.5],[0.5,0.5,0]]

deform:
    save: ./deform
    run: true
    # load: null
    # load_opt: null
    ratio: [0.96, 0.98, 1.00, 1.02, 1.04]

supercell:
    # load: null
    save: ./supercell
    symprec: 1.0e-05
    supercell_matrix: [2, 2, 2]
    distance: 0.01
    random_seed: 42

phonon:
    save: ./phonon
    symm_fc2: true
    mesh_numbers: [48, 48, 48]
    run_dos: true
    run_band: true
    symprec: 1.0e-05
    t_min: 0
    t_max: 1000
    t_step: 2

qha:
    save: ./qha
    write: e-v.dat
    t_max: 901
    thin_number: 50
    data: ./data
    plot: ./plot
    full: ./full
    eos: birch_murnaghan

opt:
    unitcell:
        fmax: 1.0e-06
        steps: 500000
        optimizer: fire2
        cell_filter: unitcell
        mask: [1, 1, 1, 1, 1, 1]
        fix_symm: true

    deform:
        fmax: 1.0e-06
        steps: 500000
        optimizer: fire2
        fix_symm: true 
        cell_filter: unitcell
        mask: [0, 0, 0, 0, 0, 0]

...
