---

data:
    input: ./POSCAR_Si # input structure file
    load_args:
        format: vasp
        index: 0
    output: omni # directory to save outputs; will be automatically generated if not found

calculator:
    calc_type: omni
    model_path: /data2/shared_data/cps/omni/oob_v6/checkpoint_1.pth
    # model_path: /data2/shared_data/pretrained/7net_chgTot/checkpoint_best.pth # absolute path of the binary file
    calc_args: # will be pased to SevenNetCalculator 
        device: cuda 
        modal: omat24

unitcell:
    run: true
    load: false # if true, ./unitcell/CONTCAR will be read
    save: ./unitcell
    primitive_matrix: [[0,0.5,0.5],[0.5,0,0.5],[0.5,0.5,0]] # 3 by 3 list or one from [a, b, c, f, i, r, p, auto]

deform:
    save: ./deform
    run: true
    load: false # if true ./deform/e0/POSCAR .. will be read
    load_opt: false # if true, ./deform/e0/CONTCAR .. will be read
    ratio: [0.96, 0.98, 1.00, 1.02, 1.04] # list of scaling factors

supercell:
    save: ./supercell
    run: true
    symprec: 1.0e-05 
    supercell_matrix: [2, 2, 2]
    distance: 0.01 # phonopy default
    random_seed: 42

phonon:
    save: ./phonon
    symm_fc2: true
    mesh_numbers: [21, 21, 21]
    run_dos: true # if false, will be skipped
    run_band: true # if false, will be skipped
    symprec: 1.0e-05
    t_min: 0 # t_min for calculating thermal properties
    t_max: 1000 # t_max for calculating thermal properties
    t_step: 2 # delta t for thermal properties

qha:
    save: ./qha
    t_max: 901 # temperature limit for qha
    thin_number: 50 # interval temp displayed on F-V.png
    data: ./data
    plot: ./plot
    full: ./full
    eos: birch_murnaghan # ['vinet', 'birch', 'birch_murnaghan']

opt:
    unitcell:
        fmax: 1.0e-03
        steps: 5000
        optimizer: fire2
        fix_symm: true
        cell_filter: unitcell
        mask: [1, 1, 1, 1, 1, 1]

    deform:
        fmax: 1.0e-03
        steps: 5000
        optimizer: fire2
        fix_symm: true 
        cell_filter: unitcell
        mask: [0, 0, 0, 0, 0, 0]

...
